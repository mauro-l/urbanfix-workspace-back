services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanfix_dev}
      POSTGRES_USER: ${POSTGRES_USER:-urbanfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanfix_dev_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
