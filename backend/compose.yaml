# Local development/QA environment.
#
# The schema is owned by prisma/migrations. `migrate` applies those exact
# migrations before the API starts, so a fresh checkout can never run against
# an outdated database.
#
# Canonical command (from backend/):
#   docker compose --env-file docker.env up -d --build

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanfix_dev}
      POSTGRES_USER: ${POSTGRES_USER:-urbanfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanfix_dev_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations against the local database.
  # Containers reach Postgres through the `db` service name, never 127.0.0.1.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-urbanfix}:${POSTGRES_PASSWORD:-urbanfix_dev_pw}@db:5432/${POSTGRES_DB:-urbanfix_dev}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-urbanfix}:${POSTGRES_PASSWORD:-urbanfix_dev_pw}@db:5432/${POSTGRES_DB:-urbanfix_dev}?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Optional demo data. Opt-in on purpose: `up` never overwrites QA fixtures.
  #   docker compose --env-file docker.env run --rm seed
  seed:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-urbanfix}:${POSTGRES_PASSWORD:-urbanfix_dev_pw}@db:5432/${POSTGRES_DB:-urbanfix_dev}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-urbanfix}:${POSTGRES_PASSWORD:-urbanfix_dev_pw}@db:5432/${POSTGRES_DB:-urbanfix_dev}?schema=public"
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["seed"]
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-urbanfix}:${POSTGRES_PASSWORD:-urbanfix_dev_pw}@db:5432/${POSTGRES_DB:-urbanfix_dev}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-urbanfix}:${POSTGRES_PASSWORD:-urbanfix_dev_pw}@db:5432/${POSTGRES_DB:-urbanfix_dev}?schema=public"
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3001/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
